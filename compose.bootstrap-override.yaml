services:
  madara:
    command:
      - "--name"
      - "DroneSwarm"
      - "--base-path"
      - "/data/madara"
      - "--chain-config-path"
      - "/configs/madara.yaml"
      - "--rpc-port"
      - "9944"
      - "--rpc-admin-port"
      - "9943"
      - "--rpc-cors"
      - "*"
      - "--gateway-port"
      - "8080"
      - "--l1-gas-price"
      - "1"
      - "--blob-gas-price"
      - "1"
      - "--strk-per-eth"
      - "1"
      - "--flush-every-n-blocks"
      - "1"
      - "--rpc-external"
      - "--rpc-admin"
      - "--rpc-admin-external"
      - "--feeder-gateway-enable"
      - "--gateway-enable"
      - "--gateway-external"
      - "--sequencer"
      - "--no-charge-fee"
      - "--otel-collector-endpoint"
      - "http://otel-collector:4317"
      - "--otel-export-metrics"
      - "true"
      - "--l1-endpoint"
      - "http://besu-validator1:8545"
      - "--rpc-storage-proof-max-distance"
      - "10000"
