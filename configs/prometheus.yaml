global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: 'madara-appchain'
    static_configs:
      - targets: ['otel-collector:9464']
        labels:
          stack: 'drone_swarm'

  - job_name: 'stwo-gateway'
    static_configs:
      - targets: ['stwo-gateway:6000']
        labels:
          stack: 'drone_swarm'

  - job_name: 'besu-exporter'
    static_configs:
      - targets: ['besu-exporter:6001']
        labels:
          stack: 'drone_swarm'
